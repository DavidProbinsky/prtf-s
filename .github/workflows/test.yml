name: Test PRTF-S

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Page and reference implementation agree
        run: node scripts/test.js prtf-s.html
      - name: Data file is up to date
        run: |
          node scripts/export_json.js prtf-s.html
          git diff --exit-code -- data || (echo "::error::Run node scripts/export_json.js prtf-s.html and commit the result" && exit 1)
